<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARZIE DISCOUNTED TOP-UPS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-pink-400 to-purple-700 min-h-screen p-3">
<div class="max-w-md mx-auto bg-white rounded-[24px] overflow-hidden shadow-2xl">
<div class="bg-gradient-to-r from-pink-500 to-purple-600 p-5 text-white text-center">
<h1 class="text-2xl font-black">ARZIE DISCOUNTED TOP-UPS 💎</h1>
<p class="text-sm">Legit • Mura • Fast - MLBB</p>
</div>
<div class="p-4 space-y-4">
<div class="bg-gray-50 p-3 rounded-xl">
<label class="font-bold text-sm">MLBB ID + Zone</label>
<div class="flex gap-2 mt-2">
<input id="mlid" placeholder="ML ID ex: 12345678" class="flex-1 border-2 border-pink-200 rounded-lg p-3 font-bold">
<input id="zone" placeholder="Zone" class="w-24 border-2 border-pink-200 rounded-lg p-3 font-bold">
</div>
</div>
<div>
<h3 class="font-black mb-2">Pili Package Boss 👇</h3>
<div class="grid grid-cols-2 gap-2" id="packages"></div>
</div>
<div id="selectedBox" class="hidden bg-pink-50 border-2 border-pink-300 p-3 rounded-xl text-center font-bold"></div>
<button onclick="orderNow()" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-black py-4 rounded-xl text-lg">ORDER NOW</button>

<!-- CONTACT ADMIN - FB LINK MO BOSS -->
<a href="https://www.facebook.com/share/1DegvvE2NK/" target="_blank" class="block w-full bg-[#1877F2] text-white font-black py-4 rounded-xl text-center shadow-lg">
📩 CONTACT ADMIN FOR INQUIRIES
</a>
<p class="text-center text-[11px] text-gray-500">Direct FB - Mabilis Reply!</p>
</div>
</div>
<script>
const pkgs=[
{ d:86, p:65 }, { d:172, p:130 }, { d:257, p:195 }, { d:344, p:260 },
{ d:429, p:325 }, { d:514, p:390 }, { d:600, p:455 }, { d:706, p:535 },
{ d:1412, p:1070 }, { d:2195, p:1605 }
];
let sel=null;
const box=document.getElementById('packages');
pkgs.forEach(x=>{
box.innerHTML+=`<button onclick="selectPkg(${x.d},${x.p})" class="border-2 border-gray-200 rounded-xl p-3 text-left hover:border-pink-400"><div class="font-black text-pink-600">${x.d} 💎</div><div class="font-bold">₱${x.p}</div></button>`;
});
function selectPkg(d,p){ sel={d,p}; document.getElementById('selectedBox').classList.remove('hidden'); document.getElementById('selectedBox').innerHTML=`Selected: ${d} Diamonds - ₱${p}`; }
async function orderNow(){
const id=document.getElementById('mlid').value;
const zone=document.getElementById('zone').value;
if(!id||!zone||!sel){ alert('Boss lagay mo ID, Zone at package!'); return; }
// Dito papasok Nexone API mo - naka-save na sa Vercel!
alert(`Order Received Boss!\nID: ${id} (${zone})\n${sel.d} Diamonds - ₱${sel.p}\n\nNa-save na! PM ka sa CONTACT ADMIN para ma-process agad!`);
window.open('https://www.facebook.com/share/1DegvvE2NK/','_blank');
}
</script>
</body>
</html>
